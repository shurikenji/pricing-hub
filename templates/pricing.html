{% extends "base.html" %}
{% block title %}Model Pricing — Pricing Hub{% endblock %}

{% block content %}
<div x-data="pricingApp()" x-init="init()" x-cloak>

    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
        <div>
            <h1 class="text-2xl font-bold">Model Pricing</h1>
            <p class="text-base-content/60 text-sm mt-1">
                <span x-text="filteredModels.length"></span> models
                <span x-show="selectedGroup"> in <span class="badge badge-sm badge-primary" x-text="selectedGroup"></span></span>
            </p>
        </div>

        <!-- Server selector -->
        <div class="flex flex-wrap gap-2 items-center">
            <select class="select select-bordered select-sm w-48" x-model="selectedServer" @change="loadPricing()">
                <option value="">Select server...</option>
                {% for s in servers %}
                <option value="{{ s.id }}" {% if s.id == selected_server_id %}selected{% endif %}>{{ s.name }}</option>
                {% endfor %}
            </select>

            <!-- View toggle -->
            <div class="btn-group">
                <button class="btn btn-sm" :class="viewMode === 'grid' ? 'btn-active' : ''" @click="viewMode = 'grid'">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                </button>
                <button class="btn btn-sm" :class="viewMode === 'list' ? 'btn-active' : ''" @click="viewMode = 'list'">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Filters -->
    <div class="flex flex-wrap gap-2 mb-4">
        <!-- Search -->
        <input type="text" placeholder="Search model..." class="input input-bordered input-sm w-64"
               x-model="searchQuery" @input.debounce.200ms="applyFilters()">

        <!-- Group filter -->
        <select class="select select-bordered select-sm" x-model="selectedGroup" @change="applyFilters()">
            <option value="">All groups</option>
            <template x-for="g in groups" :key="g.name">
                <option :value="g.name" x-text="g.display_name + ' (' + g.ratio + 'x)'"></option>
            </template>
        </select>

        <!-- Tag filter -->
        <select class="select select-bordered select-sm" x-model="selectedTag" @change="applyFilters()">
            <option value="">All types</option>
            <template x-for="tag in allTags" :key="tag">
                <option :value="tag" x-text="tag"></option>
            </template>
        </select>

        <!-- Pricing mode filter -->
        <select class="select select-bordered select-sm" x-model="selectedMode" @change="applyFilters()">
            <option value="">All pricing</option>
            <option value="token">Token-based</option>
            <option value="fixed">Fixed price</option>
        </select>
    </div>

    <!-- Loading -->
    <div x-show="loading" class="flex justify-center py-12">
        <span class="loading loading-spinner loading-lg"></span>
    </div>

    <!-- No servers -->
    <div x-show="!loading && !selectedServer" class="alert alert-info">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>Select a server to view model pricing.</span>
    </div>

    <!-- Grid view -->
    <div x-show="!loading && viewMode === 'grid'" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
        <template x-for="model in filteredModels" :key="model.model_name">
            <div class="card bg-base-100 shadow-sm hover:shadow-md transition-shadow cursor-pointer fade-in"
                 @click="openDetail(model)">
                <div class="card-body p-4">
                    <h3 class="card-title text-sm font-mono break-all" x-text="model.model_name"></h3>
                    <!-- Tags -->
                    <div class="flex flex-wrap gap-1 mt-1">
                        <template x-for="tag in model.tags.slice(0, 4)" :key="tag">
                            <span class="badge badge-xs badge-outline" x-text="tag"></span>
                        </template>
                    </div>
                    <!-- Price -->
                    <div class="mt-2 text-xs">
                        <template x-if="model.pricing_mode === 'token'">
                            <div>
                                <div class="flex justify-between">
                                    <span class="text-base-content/50">Input</span>
                                    <span class="font-semibold text-success" x-text="'$' + model.input_price_per_1m?.toFixed(2) + '/1M'"></span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-base-content/50">Output</span>
                                    <span class="font-semibold text-warning" x-text="'$' + model.output_price_per_1m?.toFixed(2) + '/1M'"></span>
                                </div>
                            </div>
                        </template>
                        <template x-if="model.pricing_mode === 'fixed'">
                            <div class="flex justify-between">
                                <span class="text-base-content/50">Per request</span>
                                <span class="font-semibold text-info" x-text="'$' + model.request_price?.toFixed(4)"></span>
                            </div>
                        </template>
                    </div>
                    <!-- Groups count -->
                    <div class="text-xs text-base-content/40 mt-1">
                        <span x-text="Object.keys(model.group_prices || {}).length"></span> groups
                    </div>
                </div>
            </div>
        </template>
    </div>

    <!-- List view -->
    <div x-show="!loading && viewMode === 'list'" class="overflow-x-auto">
        <table class="table table-sm table-zebra">
            <thead>
                <tr>
                    <th>Model</th>
                    <th>Type</th>
                    <th>Input $/1M</th>
                    <th>Output $/1M</th>
                    <th>Tags</th>
                    <th>Groups</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="model in filteredModels" :key="model.model_name">
                    <tr class="hover cursor-pointer" @click="openDetail(model)">
                        <td class="font-mono text-sm" x-text="model.model_name"></td>
                        <td><span class="badge badge-xs" x-text="model.pricing_mode"></span></td>
                        <td x-text="model.input_price_per_1m != null ? '$' + model.input_price_per_1m.toFixed(2) : model.request_price != null ? '$' + model.request_price.toFixed(4) + '/req' : '—'"></td>
                        <td x-text="model.output_price_per_1m != null ? '$' + model.output_price_per_1m.toFixed(2) : '—'"></td>
                        <td>
                            <div class="flex flex-wrap gap-1">
                                <template x-for="tag in model.tags.slice(0, 3)" :key="tag">
                                    <span class="badge badge-xs badge-outline" x-text="tag"></span>
                                </template>
                            </div>
                        </td>
                        <td x-text="Object.keys(model.group_prices || {}).length"></td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <!-- Detail side panel (drawer) -->
    <div class="drawer drawer-end" :class="{ 'drawer-open': detailOpen }">
        <input type="checkbox" class="drawer-toggle" :checked="detailOpen">
        <div class="drawer-side z-50">
            <label class="drawer-overlay" @click="detailOpen = false"></label>
            <div class="bg-base-100 min-h-full w-full max-w-lg p-6 overflow-y-auto">
                <template x-if="detailModel">
                    <div>
                        <!-- Header -->
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h2 class="text-lg font-bold font-mono break-all" x-text="detailModel.model_name"></h2>
                                <p class="text-sm text-base-content/60 mt-1" x-text="detailModel.description"></p>
                            </div>
                            <button class="btn btn-sm btn-ghost" @click="detailOpen = false">✕</button>
                        </div>

                        <!-- Copy model ID -->
                        <button class="btn btn-sm btn-outline btn-block mb-4"
                                @click="navigator.clipboard.writeText(detailModel.model_name); $el.textContent = 'Copied!'; setTimeout(() => $el.textContent = 'Copy Model ID', 1500)">
                            Copy Model ID
                        </button>

                        <!-- Tags -->
                        <div class="flex flex-wrap gap-1 mb-4">
                            <template x-for="tag in detailModel.tags" :key="tag">
                                <span class="badge badge-sm badge-primary badge-outline" x-text="tag"></span>
                            </template>
                        </div>

                        <!-- Endpoints -->
                        <template x-if="detailModel.supported_endpoints?.length">
                            <div class="mb-4">
                                <h3 class="text-sm font-semibold mb-2">API Endpoints</h3>
                                <template x-for="ep in detailModel.supported_endpoints" :key="ep">
                                    <code class="block text-xs bg-base-200 px-2 py-1 rounded mb-1 font-mono" x-text="ep"></code>
                                </template>
                            </div>
                        </template>

                        <!-- Base price -->
                        <div class="mb-4">
                            <h3 class="text-sm font-semibold mb-2">Base Price (ratio 1x)</h3>
                            <template x-if="detailModel.pricing_mode === 'token'">
                                <div class="stats stats-vertical shadow w-full">
                                    <div class="stat py-2">
                                        <div class="stat-title text-xs">Input</div>
                                        <div class="stat-value text-lg text-success" x-text="'$' + (detailModel.input_price_per_1m?.toFixed(2) || '0') + '/1M'"></div>
                                    </div>
                                    <div class="stat py-2">
                                        <div class="stat-title text-xs">Output</div>
                                        <div class="stat-value text-lg text-warning" x-text="'$' + (detailModel.output_price_per_1m?.toFixed(2) || '0') + '/1M'"></div>
                                    </div>
                                    <template x-if="detailModel.cached_input_price_per_1m != null">
                                        <div class="stat py-2">
                                            <div class="stat-title text-xs">Cached Input</div>
                                            <div class="stat-value text-lg text-info" x-text="'$' + detailModel.cached_input_price_per_1m.toFixed(2) + '/1M'"></div>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            <template x-if="detailModel.pricing_mode === 'fixed'">
                                <div class="stats shadow w-full">
                                    <div class="stat">
                                        <div class="stat-title text-xs">Per Request</div>
                                        <div class="stat-value text-lg text-info" x-text="'$' + (detailModel.request_price?.toFixed(4) || '0')"></div>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- Group prices -->
                        <template x-if="Object.keys(detailModel.group_prices || {}).length > 0">
                            <div>
                                <h3 class="text-sm font-semibold mb-2">Group Prices</h3>
                                <div class="overflow-x-auto">
                                    <table class="table table-xs">
                                        <thead>
                                            <tr>
                                                <th>Group</th>
                                                <th>Ratio</th>
                                                <th>Input</th>
                                                <th>Output</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template x-for="(gp, gname) in detailModel.group_prices" :key="gname">
                                                <tr>
                                                    <td class="text-xs" x-text="gp.group_display_name || gname"></td>
                                                    <td x-text="gp.group_ratio + 'x'"></td>
                                                    <td class="text-success text-xs" x-text="gp.input_price_per_1m != null ? '$' + gp.input_price_per_1m.toFixed(2) : gp.request_price != null ? '$' + gp.request_price.toFixed(4) : '—'"></td>
                                                    <td class="text-warning text-xs" x-text="gp.output_price_per_1m != null ? '$' + gp.output_price_per_1m.toFixed(2) : '—'"></td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function pricingApp() {
    return {
        // State
        selectedServer: '{{ selected_server_id }}',
        pricing: {{ pricing | tojson if pricing else 'null' }},
        loading: false,
        viewMode: 'grid',
        searchQuery: '',
        selectedGroup: '',
        selectedTag: '',
        selectedMode: '',
        detailOpen: false,
        detailModel: null,
        models: [],
        groups: [],
        filteredModels: [],
        allTags: [],

        init() {
            if (this.pricing) {
                this.models = this.pricing.models || [];
                this.groups = this.pricing.groups || [];
                this.buildTags();
                this.applyFilters();
            }
        },

        async loadPricing() {
            if (!this.selectedServer) return;
            this.loading = true;
            try {
                const resp = await fetch(`/api/pricing/${this.selectedServer}`);
                this.pricing = await resp.json();
                this.models = this.pricing.models || [];
                this.groups = this.pricing.groups || [];
                this.buildTags();
                this.selectedGroup = '';
                this.selectedTag = '';
                this.selectedMode = '';
                this.searchQuery = '';
                this.applyFilters();
                // Update URL
                history.replaceState(null, '', `/pricing?server=${this.selectedServer}`);
            } catch (e) {
                console.error('Failed to load pricing:', e);
            }
            this.loading = false;
        },

        buildTags() {
            const tagSet = new Set();
            for (const m of this.models) {
                for (const t of (m.tags || [])) tagSet.add(t);
            }
            this.allTags = [...tagSet].sort();
        },

        applyFilters() {
            let result = this.models;
            const q = this.searchQuery.toLowerCase().trim();

            if (q) {
                result = result.filter(m =>
                    m.model_name.toLowerCase().includes(q) ||
                    (m.description || '').toLowerCase().includes(q) ||
                    (m.vendor_name || '').toLowerCase().includes(q)
                );
            }
            if (this.selectedGroup) {
                result = result.filter(m =>
                    (m.enable_groups || []).includes(this.selectedGroup)
                );
            }
            if (this.selectedTag) {
                result = result.filter(m =>
                    (m.tags || []).includes(this.selectedTag)
                );
            }
            if (this.selectedMode) {
                result = result.filter(m => m.pricing_mode === this.selectedMode);
            }
            this.filteredModels = result;
        },

        openDetail(model) {
            this.detailModel = model;
            this.detailOpen = true;
        },
    };
}
</script>
{% endblock %}
