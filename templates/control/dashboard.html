{% extends "base.html" %}
{% block title %}Admin — Pricing Hub{% endblock %}

{% block content %}
<div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">Admin Panel</h1>
    <a href="/control/logout" class="btn btn-sm btn-ghost">Logout</a>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <a href="/control/servers" class="card bg-base-100 shadow-sm hover:shadow-md transition-shadow">
        <div class="card-body">
            <h2 class="card-title">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2"/></svg>
                Servers
            </h2>
            <p class="text-base-content/60">Add, edit, and manage upstream API servers.</p>
        </div>
    </a>
    <a href="/pricing" class="card bg-base-100 shadow-sm hover:shadow-md transition-shadow">
        <div class="card-body">
            <h2 class="card-title">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                View Pricing
            </h2>
            <p class="text-base-content/60">Browse the public pricing page.</p>
        </div>
    </a>
</div>
{% endblock %}
